name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libgl-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libasound2t64

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.7.3"
          cache: true
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Build and run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          qmake6 -v
          meson setup build --buildtype=release
          meson test -C build --suite unit --print-errorlogs

  db-parity:
    name: SQLite vs PostgreSQL parity
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kitsas
          POSTGRES_PASSWORD: kitsas
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitsas -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      QT_QPA_PLATFORM: offscreen
      KITSAS_REQUIRE_POSTGRES: "1"
      KITSAS_PG_HOST: localhost
      KITSAS_PG_PORT: "5432"
      KITSAS_PG_USER: kitsas
      KITSAS_PG_PASSWORD: kitsas
      KITSAS_PG_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libzip-dev \
            libgl-dev \
            libpq5 \
            libpq-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libasound2t64

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.7.3"
          cache: true
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Build and run dbparity
        run: |
          set -euo pipefail
          meson setup build --buildtype=release
          meson test -C build --suite dbparity --print-errorlogs

  build:
    name: Build Kitsas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libzip-dev \
            libgl-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libasound2t64

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.7.3"
          cache: true
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Configure
        run: |
          set -euo pipefail
          meson setup build --buildtype=release

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          python3 tools/sbom/meson_to_cyclonedx.py build -o build/sbom.cdx.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom.cdx.json
          path: build/sbom.cdx.json
          if-no-files-found: error

      - name: Build Kitsas and run stability tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          meson compile -C build
          test -x build/kiswaspg
          meson test -C build --suite vakaus --print-errorlogs

  build-macos:
    name: Build Kitsas (macOS)
    runs-on: macos-14
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.7.3"
          cache: true
          arch: clang_64
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Install Meson
        run: brew install meson ninja

      - name: Build
        run: |
          set -euo pipefail
          qmake -v
          meson setup build-macos --buildtype=release
          meson compile -C build-macos
          test -d build-macos/kiswaspg.app

      - name: Bundle Qt frameworks and package ZIP
        run: |
          set -euo pipefail
          app="build-macos/kiswaspg.app"
          test -d "$app"
          macdeployqt "$app"
          ditto -c -k --keepParent "$app" build-macos/kiswaspg-macOS.zip

      - name: Upload kiswaspg-macOS
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiswaspg-macOS
          path: build-macos/kiswaspg-macOS.zip
          if-no-files-found: error
