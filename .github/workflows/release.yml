name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag that receives the binaries
        required: true
        default: v6.0.0

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            wget \
            patchelf \
            libzip-dev \
            libgl-dev \
            libpq5 \
            libssl3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libasound2t64 \
            libfuse2t64

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.7.3"
          cache: true
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Build Kitsas
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          qmake ../kitsas/kitsas.pro -spec linux-g++ "CONFIG+=release"
          make -j"$(nproc)"
          test -x kiswaspg

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          wget -q -O "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O "$tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools"/*.AppImage
          export PATH="$tools:$PATH"

          mkdir -p dist
          cd dist
          linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e "$GITHUB_WORKSPACE/build/kiswaspg" \
            -i "$GITHUB_WORKSPACE/kitsas/pic/Possu64.png" \
            -d "$GITHUB_WORKSPACE/kitsas.desktop" \
            -l /usr/lib/x86_64-linux-gnu/libssl.so.3 \
            -l /usr/lib/x86_64-linux-gnu/libcrypto.so.3 \
            -l /usr/lib/x86_64-linux-gnu/libpq.so.5 \
            --plugin qt \
            --output appimage
          appimage="$(find . -maxdepth 1 -name '*.AppImage' -printf '%f\n')"
          test -n "$appimage"
          mv "$appimage" "$GITHUB_WORKSPACE/KiswasPG-${version}-linux-x86_64.AppImage"

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset="$GITHUB_WORKSPACE/KiswasPG-${version}-linux-x86_64.AppImage"
          test -f "$asset"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_TAG" \
              --title "Kiswas PG ${version}" \
              --notes "$(printf '%s\n' "Kiswas PG ${version}" "" "Linux, macOS and Windows binaries. macOS and Windows packages are unsigned.")" \
              || true
          fi
          gh release upload "$RELEASE_TAG" "$asset" --clobber

  macos:
    name: macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.7.3"
          cache: true
          arch: clang_64
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p build-macos
          cd build-macos
          qmake ../kitsas/kitsas.pro -spec macx-xcode
          xcodebuild \
            -project kiswaspg.xcodeproj \
            -target kiswaspg \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-
          app="build/Release/kiswaspg.app"
          test -d "$app"
          macdeployqt "$app"
          ditto -c -k --keepParent "$app" "$GITHUB_WORKSPACE/KiswasPG-${version}-macOS.zip"

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset="$GITHUB_WORKSPACE/KiswasPG-${version}-macOS.zip"
          test -f "$asset"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_TAG" \
              --title "Kiswas PG ${version}" \
              --notes "$(printf '%s\n' "Kiswas PG ${version}" "" "Linux, macOS and Windows binaries. macOS and Windows packages are unsigned.")" \
              || true
          fi
          gh release upload "$RELEASE_TAG" "$asset" --clobber

  windows:
    name: Windows app
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.7.3"
          cache: true
          arch: win64_msvc2019_64
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Build and package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p build
          cd build
          qmake ../kitsas/kitsas.pro -spec win32-msvc "CONFIG+=release"
          nmake
          exe="$(find . -type f -name 'kiswaspg.exe' | head -n 1)"
          test -n "$exe"
          windeployqt --release --compiler-runtime "$exe"
          python -c 'import os, shutil, sys; shutil.make_archive(sys.argv[1], "zip", sys.argv[2])' \
            "$GITHUB_WORKSPACE/KiswasPG-${version}-windows-x64" \
            "$(dirname "$exe")"

      - name: Attach to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset="$GITHUB_WORKSPACE/KiswasPG-${version}-windows-x64.zip"
          test -f "$asset"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_TAG" \
              --title "Kiswas PG ${version}" \
              --notes "$(printf '%s\n' "Kiswas PG ${version}" "" "Linux, macOS and Windows binaries. macOS and Windows packages are unsigned.")" \
              || true
          fi
          gh release upload "$RELEASE_TAG" "$asset" --clobber
